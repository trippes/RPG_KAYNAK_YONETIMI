name: Player click-move benchmark

on:
  push:
    branches:
      - "experiment/map-cleanup"
    paths:
      - "application/click_move_route.py"
      - "application/hex_pathfinding.py"
      - "scripts/benchmark_player_click_move.py"
      - ".github/workflows/player-click-move-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pre-optimization baseline
        uses: actions/checkout@v4
        with:
          ref: 7490aad580a169a37ad6ef0678ebe0efbc4f16c7
          path: baseline
      - name: Checkout optimized implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: optimized
      - name: Set up identical Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - name: Install baseline in isolated environment
        run: |
          python -m venv baseline/.venv
          baseline/.venv/bin/python -m pip install -e ./baseline -r ./baseline/requirements-test.txt
      - name: Install optimized version in isolated environment
        run: |
          python -m venv optimized/.venv
          optimized/.venv/bin/python -m pip install -e ./optimized -r ./optimized/requirements-test.txt
      - name: Benchmark baseline (100 iterations)
        run: |
          baseline/.venv/bin/python baseline/scripts/benchmark_player_click_move.py --iterations 100 --output baseline-results.json
      - name: Benchmark optimized version (100 iterations)
        run: |
          optimized/.venv/bin/python optimized/scripts/benchmark_player_click_move.py --iterations 100 --output optimized-results.json
      - name: Build same-runner comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path("baseline-results.json").read_text(encoding="utf-8"))
          optimized = json.loads(Path("optimized-results.json").read_text(encoding="utf-8"))
          if baseline["python_version"] != optimized["python_version"]:
              raise SystemExit("Python versions differ; refusing invalid comparison.")
          if baseline["platform"] != optimized["platform"]:
              raise SystemExit("Platform strings differ; refusing invalid comparison.")
          before = {item["route_cells"]: item for item in baseline["scenarios"]}
          after = {item["route_cells"]: item for item in optimized["scenarios"]}
          if before.keys() != after.keys():
              raise SystemExit("Route scenarios differ; refusing invalid comparison.")

          rows = []
          for route_cells in sorted(before):
              old = before[route_cells]
              new = after[route_cells]
              old_ms = old["baseline"]["path_planning_p50_ms"]
              new_ms = new["baseline"]["path_planning_p50_ms"]
              rows.append({
                  "route_cells": route_cells,
                  "baseline_p50_ms": old_ms,
                  "optimized_p50_ms": new_ms,
                  "p50_change_percent": round((new_ms / old_ms - 1) * 100, 3),
                  "baseline_p95_ms": old["baseline"]["path_planning_p95_ms"],
                  "optimized_p95_ms": new["baseline"]["path_planning_p95_ms"],
                  "baseline_p99_ms": old["baseline"]["path_planning_p99_ms"],
                  "optimized_p99_ms": new["baseline"]["path_planning_p99_ms"],
                  "baseline_edge_validator_calls": old["edge_validation_profile"]["edge_validator_calls_per_query_p50"],
                  "optimized_edge_validator_calls": new["edge_validation_profile"]["edge_validator_calls_per_query_p50"],
                  "baseline_edge_validator_share_percent": old["edge_validation_profile"]["estimated_edge_validator_share_p50_percent"],
                  "optimized_edge_validator_share_percent": new["edge_validation_profile"]["estimated_edge_validator_share_p50_percent"],
              })

          comparison = {
              "comparison": "eldoria_player_click_to_move_same_runner",
              "baseline_commit": "7490aad580a169a37ad6ef0678ebe0efbc4f16c7",
              "optimized_commit": "${{ github.sha }}",
              "python_version": baseline["python_version"],
              "platform": baseline["platform"],
              "iterations_per_scenario": baseline["iterations"],
              "route_lengths_cells": baseline["route_lengths_cells"],
              "rows": rows,
              "method_note": "Both revisions ran sequentially on the same GitHub Actions job/runner with isolated virtual environments, identical Python version, dependencies as declared by each revision, 100 iterations, and identical benchmark script lineage. p50 percentage is (optimized / baseline - 1) * 100; negative means faster.",
          }
          Path("same-runner-comparison.json").write_text(
              json.dumps(comparison, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(comparison, indent=2))
          PY
      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-click-move-same-runner-comparison
          path: |
            baseline-results.json
            optimized-results.json
            same-runner-comparison.json
          if-no-files-found: error
          retention-days: 30
