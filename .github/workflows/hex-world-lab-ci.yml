name: Hex World Laboratory CI

on:
  push:
    branches:
      - experiment/hex-world-laboratory
  pull_request:
    branches:
      - experiment/hex-world-laboratory
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hex-world-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Laboratory tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/hex_world_laboratory
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/hex_world_laboratory/pyproject.toml

      - name: Install laboratory and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run complete laboratory test suite
        run: python -m pytest -q

      - name: Benchmark map persistence (100 / 1,000 / 10,000 cells)
        run: python scripts/benchmark_map_persistence.py

      - name: Benchmark runtime persistence (100 / 1,000 / 10,000 overrides)
        run: python scripts/benchmark_runtime_persistence.py

      - name: Benchmark movement and hex-cell tracking (1 / 10 / 100 / 1,000 actors)
        run: python benchmarks/benchmark_movement_demo.py

      - name: Benchmark integrated movement and continuous collision (1 / 10 / 100 / 1,000 actors)
        run: python benchmarks/benchmark_collision_aware_movement.py

      - name: Benchmark viewport-aware rendering (61 / 128 / 256 / 1,000 / 10,000 / 50,000 cells)
        run: python benchmarks/benchmark_render_visibility.py

      - name: Benchmark Phase 8 spatial indexes
        run: python benchmarks/benchmark_spatial_index.py

      - name: Benchmark Phase 8 spatial tuning parameters
        run: python benchmarks/benchmark_spatial_tuning.py

      - name: Benchmark Phase 8 hex neighborhood queries
        run: python benchmarks/benchmark_hex_neighborhood.py

      - name: Upload Phase 8 benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-08-benchmark-reports
          path: experiments/hex_world_laboratory/artifacts/phase-08/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Phase 7 visual test scenes
        run: python scripts/render_phase_07_scenes.py --output artifacts/phase-07

      - name: Upload Phase 7 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-07-visual-scenes
          path: experiments/hex_world_laboratory/artifacts/phase-07/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Benchmark Phase 9 entity spatial index (100 / 1,000 / 10,000 entities)
        run: python benchmarks/benchmark_entity_spatial.py

      - name: Benchmark Phase 10 simulation tick and render snapshot costs
        run: python benchmarks/benchmark_simulation_tick.py

      - name: Upload Phase 10 simulation benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-simulation-benchmark
          path: experiments/hex_world_laboratory/artifacts/phase-10/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Phase 9 entity visual evidence
        run: python scripts/render_phase_09_scenes.py --output artifacts/phase-09

      - name: Upload Phase 9 entity visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-09-entity-scenes
          path: |
            experiments/hex_world_laboratory/artifacts/phase-09/*.png
            experiments/hex_world_laboratory/artifacts/phase-09/*.json
          if-no-files-found: error
          retention-days: 14
