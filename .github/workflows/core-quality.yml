name: Core quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Report legacy API usage
        run: python -m core.compatibility.usage . | tee legacy-api-usage.json
      - name: Upload legacy API usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-api-usage-linux
          path: legacy-api-usage.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run release-candidate verification
        run: python scripts/verify_release.py

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Report legacy API usage
        shell: bash
        run: python -m core.compatibility.usage . | tee legacy-api-usage.json
      - name: Upload legacy API usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-api-usage-windows
          path: legacy-api-usage.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run release-candidate verification
        run: python scripts/verify_release.py
