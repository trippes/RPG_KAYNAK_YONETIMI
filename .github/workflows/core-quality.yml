name: Core quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Hex World Laboratory test package
        run: python -m pip install -e "experiments/hex_world_laboratory[test,quality]"
      - name: Ruff lint (procedural graphics scope)
        working-directory: experiments/hex_world_laboratory
        run: |
          python -m ruff check src/hex_world_lab/rendering/procedural src/hex_world_lab/rendering/procedural_environment.py src/hex_world_lab/rendering/environment_assets.py tests/unit/test_procedural_canvas.py tests/unit/test_procedural_geometry.py tests/unit/test_procedural_palette.py tests/unit/test_procedural_variation.py tests/unit/test_procedural_components.py tests/unit/test_procedural_profiles.py tests/unit/test_procedural_cache.py tests/unit/test_procedural_environment_art.py tests/integration/test_environment_object_demo.py scripts/render_phase_13_scenes.py benchmarks/benchmark_phase_13_procedural_art.py

      - name: Ruff format check (procedural graphics scope)
        working-directory: experiments/hex_world_laboratory
        run: |
          python -m ruff format --check src/hex_world_lab/rendering/procedural src/hex_world_lab/rendering/procedural_environment.py src/hex_world_lab/rendering/environment_assets.py tests/unit/test_procedural_canvas.py tests/unit/test_procedural_geometry.py tests/unit/test_procedural_palette.py tests/unit/test_procedural_variation.py tests/unit/test_procedural_components.py tests/unit/test_procedural_profiles.py tests/unit/test_procedural_cache.py tests/unit/test_procedural_environment_art.py tests/integration/test_environment_object_demo.py scripts/render_phase_13_scenes.py benchmarks/benchmark_phase_13_procedural_art.py

      - name: Report legacy API usage
        run: python -m core.compatibility.usage . | tee legacy-api-usage.json
      - name: Upload legacy API usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-api-usage-linux
          path: legacy-api-usage.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run release-candidate verification
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: python scripts/verify_release.py

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Hex World Laboratory test package
        run: python -m pip install -e "experiments/hex_world_laboratory[test,quality]"
      - name: Ruff lint (procedural graphics scope)
        run: |
          python -m ruff check --config experiments/hex_world_laboratory/pyproject.toml experiments/hex_world_laboratory/src/hex_world_lab/rendering/procedural experiments/hex_world_laboratory/src/hex_world_lab/rendering/procedural_environment.py experiments/hex_world_laboratory/src/hex_world_lab/rendering/environment_assets.py experiments/hex_world_laboratory/tests/unit/test_procedural_canvas.py experiments/hex_world_laboratory/tests/unit/test_procedural_geometry.py experiments/hex_world_laboratory/tests/unit/test_procedural_palette.py experiments/hex_world_laboratory/tests/unit/test_procedural_variation.py experiments/hex_world_laboratory/tests/unit/test_procedural_components.py experiments/hex_world_laboratory/tests/unit/test_procedural_profiles.py experiments/hex_world_laboratory/tests/unit/test_procedural_cache.py experiments/hex_world_laboratory/tests/unit/test_procedural_environment_art.py experiments/hex_world_laboratory/tests/integration/test_environment_object_demo.py experiments/hex_world_laboratory/scripts/render_phase_13_scenes.py experiments/hex_world_laboratory/benchmarks/benchmark_phase_13_procedural_art.py

      - name: Ruff format check (procedural graphics scope)
        run: |
          python -m ruff format --check --config experiments/hex_world_laboratory/pyproject.toml experiments/hex_world_laboratory/src/hex_world_lab/rendering/procedural experiments/hex_world_laboratory/src/hex_world_lab/rendering/procedural_environment.py experiments/hex_world_laboratory/src/hex_world_lab/rendering/environment_assets.py experiments/hex_world_laboratory/tests/unit/test_procedural_canvas.py experiments/hex_world_laboratory/tests/unit/test_procedural_geometry.py experiments/hex_world_laboratory/tests/unit/test_procedural_palette.py experiments/hex_world_laboratory/tests/unit/test_procedural_variation.py experiments/hex_world_laboratory/tests/unit/test_procedural_components.py experiments/hex_world_laboratory/tests/unit/test_procedural_profiles.py experiments/hex_world_laboratory/tests/unit/test_procedural_cache.py experiments/hex_world_laboratory/tests/unit/test_procedural_environment_art.py experiments/hex_world_laboratory/tests/integration/test_environment_object_demo.py experiments/hex_world_laboratory/scripts/render_phase_13_scenes.py experiments/hex_world_laboratory/benchmarks/benchmark_phase_13_procedural_art.py

      - name: Report legacy API usage
        shell: bash
        run: python -m core.compatibility.usage . | tee legacy-api-usage.json
      - name: Upload legacy API usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-api-usage-windows
          path: legacy-api-usage.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run release-candidate verification
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: python scripts/verify_release.py
