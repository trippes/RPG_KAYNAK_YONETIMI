name: Core quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Lint changed runtime integration files with Ruff
        run: >-
          python -m ruff check --select E4,E7,E9,F
          --extend-per-file-ignores
          application/gameplay_service.py:F401,application/gameplay_service.py:E701
          application/hex_world_runtime.py
          application/hex_occupancy.py
          application/hex_world_geometry_bridge.py
          application/hex_actor_binding.py
          application/hex_physics_bridge.py
          application/npc_hex_binding.py
          application/resource_node_hex_binding.py
          application/market_hex_anchor.py
          application/hex_world_persistence.py
          application/save_document.py
          application/migrations.py
          application/game_application.py
          application/session_bundle.py
          application/gameplay_placement_catalog.py
          application/content_loader.py
          application/content_pack.py
          application/hex_world_initializer.py
          application/__init__.py
          application/gameplay_service.py
          application/gameplay_step_clock.py
          game_ui/movement_input.py
          application/continuous_player_movement.py
          application/actor_system.py
          application/actor_persistence.py
          application/game_application.py
          game_ui/screens/main_screen.py
          game_ui/renderer.py
          game_ui/game_window.py
          game_ui/world_rendering/__init__.py
          game_ui/world_rendering/hex_gameplay_view.py
          tests/test_application/test_session_bundle.py
          tests/test_application/test_gameplay_step_clock.py
          tests/test_application/test_movement_config_content.py
          tests/test_game_ui/test_movement_input.py
          tests/test_application/test_continuous_player_movement.py
          tests/test_application/test_actor_system.py
          tests/test_application/test_hex_world_runtime.py
          tests/test_application/test_hex_actor_binding.py
          tests/test_game_ui/test_hex_gameplay_view.py
          tests/test_application/test_gameplay_service_hex_actor_binding.py
          tests/test_application/test_hex_physics_bridge.py
          tests/test_application/test_npc_hex_binding.py
          tests/test_application/test_resource_node_hex_binding.py
          tests/test_application/test_market_hex_anchor.py
          tests/test_application/test_hex_world_persistence.py
          tests/test_application/test_hex_world_save_load.py
          tests/test_application/test_unified_save_document.py
          tests/test_application/test_game_application_save.py
          tests/test_application/test_container_persistence.py
          tests/test_application/test_content_loader.py
          tests/test_application/test_content_pack.py
          tests/test_application/test_movement_test_package.py
          tests/test_application/test_hex_world_initializer.py
          tests/test_application/test_container_hex_binding.py
          tests/test_application/test_gameplay_service_container_hex_binding.py
          application/hex_map_physics.py
          core/domain/physics/__init__.py
          core/domain/physics/body.py
          core/domain/physics/contacts.py
          core/domain/physics/continuous_solver.py
          core/domain/physics/hex_map_geometry.py
          core/domain/physics/kinematic_solver.py
          core/domain/physics/narrowphase.py
          core/domain/physics/obstacle.py
          core/domain/physics/obstacle_index.py
          core/domain/physics/shapes.py
          core/domain/physics/vector2.py
          core/domain/movement/__init__.py
          core/domain/movement/config.py
          core/domain/movement/integrator.py
          core/domain/movement/intent.py
          core/domain/movement/mode.py
          core/domain/movement/state.py
          tests/test_spatial/test_native_continuous_movement.py
          tests/test_spatial/test_native_collision_solver.py
          tests/test_spatial/test_native_continuous_collision.py
          tests/test_spatial/test_native_hex_map_geometry.py
          tests/test_spatial/test_native_physics_primitives.py
          tests/test_application/test_npc_physics_content.py
          tests/test_application/test_npc_spatial_benchmark.py
          scripts/benchmark_npc_spatial_index.py
      - name: Verify legacy map cleanup boundary
        run: python scripts/check_map_cleanup.py
      - name: Report legacy API usage
        run: python -m core.compatibility.usage . | tee legacy-api-usage.json
      - name: Upload legacy API usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-api-usage-linux
          path: legacy-api-usage.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run release-candidate verification
        run: python scripts/verify_release.py

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify legacy map cleanup boundary
        run: python scripts/check_map_cleanup.py
      - name: Report legacy API usage
        shell: bash
        run: python -m core.compatibility.usage . | tee legacy-api-usage.json
      - name: Upload legacy API usage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-api-usage-windows
          path: legacy-api-usage.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run release-candidate verification
        run: python scripts/verify_release.py
