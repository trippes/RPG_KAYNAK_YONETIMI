name: Eldoria CI

on:
  push:
    branches: [demo_eldoria]
  pull_request:
    branches: [demo_eldoria]
  workflow_dispatch:

jobs:
  test:
    name: Python tests (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s . -t . -p "test_*.py"

  pygame-headless-smoke:
    name: Pygame headless smoke test
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify Pygame can initialize without a display
        run: |
          python -c "import pygame; pygame.init(); screen = pygame.display.set_mode((1, 1)); assert screen.get_width() == 1; pygame.quit(); print('Pygame headless smoke test passed')"