name: Eldoria CI

on:
  push:
    branches: [demo_eldoria, experiment/map-cleanup]
  pull_request:
    branches: [demo_eldoria]
  workflow_dispatch:

jobs:
  test:
    name: Python tests (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-test.txt
      - name: Run unit tests
        run: python -m unittest discover -s . -t . -p "test_*.py"
      - name: Run pytest suite
        run: python -m pytest -q
      - name: Lint selected application and anatomical rig files with Ruff
        run: >-
          python -m ruff check --select E4,E7,E9,F
          application/npc_simulation_metrics.py
          application/hex_world_runtime.py
          application/npc_behavior_system.py
          application/npc_avoidance.py
          application/companion_commands.py
          application/dynamic_actor_collision.py
          game_ui/world_rendering/hex_gameplay_view.py
          game_ui/world_rendering/humanoid_rig_3d.py
          game_ui/world_rendering/humanoid_body_3d.py
          game_ui/world_rendering/humanoid_body_renderer_3d.py
          game_ui/world_rendering/humanoid_body_animation_3d.py
          scripts/benchmark_npc_perception.py
          scripts/preview_humanoid_rig_3d.py
          scripts/preview_humanoid_body_3d.py
          scripts/benchmark_humanoid_body_3d.py
          tests/test_application/test_npc_simulation_metrics.py
          tests/test_application/test_npc_behavior_system.py
          tests/test_game_ui/test_hex_gameplay_view.py
          tests/test_game_ui/test_humanoid_rig_3d.py
          tests/test_game_ui/test_humanoid_body_3d.py
          tests/test_game_ui/test_humanoid_body_renderer_3d.py
          tests/test_game_ui/test_humanoid_body_animation_3d.py

  pygame-headless-smoke:
    name: Pygame headless smoke test
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify Pygame can initialize without a display
        run: |
          python -c "import pygame; pygame.init(); screen = pygame.display.set_mode((1, 1)); assert screen.get_width() == 1; pygame.quit(); print('Pygame headless smoke test passed')"
      - name: Benchmark humanoid rendering at multiple NPC counts
        run: python scripts/benchmark_humanoid_body_3d.py --frames 1
      - name: Render the isometric world and actor pipeline
        run: python scripts/pygame_isometric_smoke.py
      - name: Upload isometric visual acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-isometric-smoke
          path: artifacts/eldoria-isometric-smoke.png
          if-no-files-found: error