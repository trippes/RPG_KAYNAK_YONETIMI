[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eldoria-hex-world-laboratory"
version = "0.1.0"
description = "Independent prototype laboratory for Eldoria's canonical hex world"
requires-python = ">=3.11"
dependencies = ["pygame>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
