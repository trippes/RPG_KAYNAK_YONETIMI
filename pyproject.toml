[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-kaynak-yonetimi"
version = "3.0.0rc1"
description = "Core, kaynak üretimi ve uygulama seviyesinde oynanabilir RPG simülasyon altyapısı"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5"]

[project.scripts]
rpg-kaynak-yonetimi = "main:main"

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.package-data]
game_ui = ["assets/*.png"]

[tool.setuptools.data-files]
"content" = ["content/active_package.json"]
"content/demo_eldoria" = ["content/demo_eldoria/manifest.json", "content/demo_eldoria/starter_content.json", "content/demo_eldoria/structure_parts.json", "content/demo_eldoria/npcs.json", "content/demo_eldoria/quests.json", "content/demo_eldoria/resources.json", "content/demo_eldoria/characters.json", "content/demo_eldoria/gameplay_rules.json", "content/demo_eldoria/items.json", "content/demo_eldoria/containers.json", "content/demo_eldoria/asset_catalog.json"]
"content/demo_eldoria/hex_maps" = ["content/demo_eldoria/hex_maps/*.json"]
"content/demo_eldoria/placements" = ["content/demo_eldoria/placements/*.json"]
"content/demo_eldoria/gameplay_placements" = ["content/demo_eldoria/gameplay_placements/*.json"]
"content/demo_eldoria/assets" = ["content/demo_eldoria/assets/*.png", "content/demo_eldoria/assets/*.json"]

[tool.unittest]
test_command = "python -m unittest discover -s . -t . -p test_*.py"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "application*",
    "character*",
    "combat*",
    "containers*",
    "core*",
    "economy*",
    "npc*",
    "game_ui*",
    "hex_world_lab*",
    "locks*",
    "quests*",
    "resources*",
    "save*",
    "time_system*",
]
exclude = ["tests*", "docs*", "scripts*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
