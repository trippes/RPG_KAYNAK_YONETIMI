[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-kaynak-yonetimi"
version = "3.0.0rc1"
description = "Core, kaynak üretimi ve uygulama seviyesinde oynanabilir RPG simülasyon altyapısı"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5"]

[project.scripts]
rpg-kaynak-yonetimi = "main:main"

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.package-data]
game_ui = ["assets/*.png"]

[tool.setuptools.data-files]
"content" = ["content/active_package.json"]
"." = ["data/starter_content.json", "data/playtest_balance.json"]
"content/demo_eldoria" = ["content/demo_eldoria/manifest.json", "content/demo_eldoria/starter_content.json", "content/demo_eldoria/npcs.json", "content/demo_eldoria/quests.json", "content/demo_eldoria/resources.json", "content/demo_eldoria/characters.json", "content/demo_eldoria/gameplay_rules.json"]

[tool.unittest]
test_command = "python -m unittest discover -s . -t . -p test_*.py"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "application*",
    "character*",
    "combat*",
    "containers*",
    "core*",
    "economy*",
    "npc*",
    "game_ui*",
    "quests*",
    "resources*",
    "save*",
    "time_system*",
    "world*",
]
exclude = ["tests*", "docs*", "scripts*"]
